<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="1200" height="850" fill="#f7f4ed"/>
<text x="600" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#19352b">Empathy Map — Gen Z</text>
<text x="600" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#567064">Wat denkt, voelt, ziet, hoort en doet de gebruiker rond eten?</text>
<rect x="65" y="145" width="510" height="270" rx="24" fill="#e5f0e7"/><rect x="625" y="145" width="510" height="270" rx="24" fill="#fff0d8"/>
<rect x="65" y="435" width="510" height="270" rx="24" fill="#e7edf8"/><rect x="625" y="435" width="510" height="270" rx="24" fill="#f7e5e2"/>
<rect x="305" y="730" width="590" height="85" rx="22" fill="#19352b"/>
<g font-family="Arial,sans-serif" fill="#19352b">
<text x="100" y="195" font-size="26" font-weight="700">DENKT &amp; VOELT</text>
<text x="100" y="242" font-size="20">• “Wat zal ik eten?”</text><text x="100" y="280" font-size="20">• “Ik wil niet te veel uitgeven.”</text><text x="100" y="318" font-size="20">• “Ik heb geen zin in iets moeilijks.”</text>
<text x="660" y="195" font-size="26" font-weight="700">ZIET</text>
<text x="660" y="242" font-size="20">• Recepten en foodvideo’s online.</text><text x="660" y="280" font-size="20">• Maaltijden die anderen delen.</text><text x="660" y="318" font-size="20">• Veel opties, maar weinig tijd.</text>
<text x="100" y="485" font-size="26" font-weight="700">ZEGT &amp; DOET</text>
<text x="100" y="532" font-size="20">• Zoekt recepten op de telefoon.</text><text x="100" y="570" font-size="20">• Kiest vaak iets makkelijks.</text><text x="100" y="608" font-size="20">• Deelt tips met vrienden.</text>
<text x="660" y="485" font-size="26" font-weight="700">HOORT</text>
<text x="660" y="532" font-size="20">• Vrienden praten over eten.</text><text x="660" y="570" font-size="20">• Tips voor goedkope recepten.</text><text x="660" y="608" font-size="20">• Reclame voor bezorgmaaltijden.</text>
</g>
<text x="600" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">PIJNPUNTEN &amp; BEHOEFTES</text>
<text x="600" y="797" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#ffffff">Weinig tijd en geld • behoefte aan snelle, goedkope en makkelijke recepten</text>
</svg>
